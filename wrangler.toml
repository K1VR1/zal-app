# Настройки выкладки сервера бота на Cloudflare Workers (npx wrangler deploy)
name = "mygym"
main = "worker.js"
compatibility_date = "2026-10-01"

# Хранилище расписаний
[[kv_namespaces]]
binding = "KV"
id = "00cbc152a7ec4d75a3d640284e8d4501"

[vars]
OWNER_ID = "947241771"

# Напоминания: раз в час ровно в :00
[triggers]
crons = ["0 * * * *"]

# Секреты задаются отдельно и в файл не пишутся: npx wrangler secret put BOT_TOKEN и ANTHROPIC_API_KEY
